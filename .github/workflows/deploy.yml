name: Build and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # BUILD — package the Lambda zip artifact
  # ---------------------------------------------------------------------------
  build:
    name: Build deployment.zip
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies into package directory
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt -t ./package

      - name: Copy application source into package directory
        run: |
          # Copy the application package
          cp -r app ./package/app

          # Copy the Lambda adapter at the root of the package
          cp lambda_handler.py ./package/lambda_handler.py

          # Copy any other top-level modules if present (excluding dev files)
          # main.py is the local uvicorn runner; it does not need to be in the zip
          # but including it does no harm
          if [ -f main.py ]; then cp main.py ./package/main.py; fi

      - name: Create deployment.zip
        run: |
          cd package
          zip -r ../deployment.zip . -x "*.pyc" -x "*/__pycache__/*" -x "*.dist-info/*"
          cd ..

      - name: Upload deployment.zip as artifact
        uses: actions/upload-artifact@v4
        with:
          name: deployment-zip
          path: deployment.zip
          retention-days: 7

  # ---------------------------------------------------------------------------
  # DEPLOY — push the zip to AWS Lambda
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to AWS Lambda
    runs-on: ubuntu-latest
    needs: build

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: deployment-zip

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Upload zip to Lambda
        run: |
          aws lambda update-function-code \
            --function-name githublamda4 \
            --zip-file fileb://deployment.zip \
            --region "$AWS_REGION"

      - name: Wait for Lambda update to complete
        run: |
          aws lambda wait function-updated \
            --function-name githublamda4 \
            --region "$AWS_REGION"

      - name: Print Function URL
        run: |-
          aws lambda get-function-url-config \
            --function-name githublamda4 \
            --region "$AWS_REGION" \
            --query 'FunctionUrl' \
            --output text
